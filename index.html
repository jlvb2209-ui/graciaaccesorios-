<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracia Accesorios | Catálogo Exclusivo</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="LOGO.PNG">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* --- ESTILOS IDÉNTICOS A TUS FOTOGRAFÍAS DE TEMPORADA --- */
        
        .hero {
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.5s ease;
        }

        /* Tema Normal / Estándar */
        body.theme-normal .hero {
            background: #000000 !important;
            border-bottom: 1px solid var(--pink-accent);
        }

        /* Tema NAVIDAD (Fondo oscuro con decoración navideña y caja de regalo) */
        body.theme-navidad .hero {
            background: linear-gradient(rgba(20, 0, 0, 0.75), rgba(10, 0, 0, 0.85)), url('navidad-bg.jpg') center/cover !important;
            border-bottom: 2px solid #d4af37;
        }

        /* Tema 15 DE SETIEMBRE / INDEPENDENCIA (Fondo tricolor / patriótico) */
        body.theme-independencia .hero {
            background: linear-gradient(rgba(0, 20, 50, 0.7), rgba(5, 10, 20, 0.85)), url('independencia-bg.jpg') center/cover !important;
            border-bottom: 2px solid #ef4444;
        }

        /* Tema SAN VALENTÍN (Fondo rojo/rosa con corazones y caja de regalo) */
        body.theme-san-valentin .hero {
            background: linear-gradient(rgba(100, 15, 40, 0.7), rgba(30, 5, 15, 0.85)), url('valentin-bg.jpg') center/cover !important;
            border-bottom: 2px solid #f4b6c2;
        }

        /* Estilos generales para los títulos temáticos flotantes */
        .banner-tematica-contenido {
            text-align: center;
            padding: 20px 16px 10px 16px;
        }
        .banner-tematica-contenido .sub-frase {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .banner-tematica-contenido .titulo-principal {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            margin: 5px 0 0 0;
            line-height: 1.1;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body id="cuerpoPagina">
    <header class="hero" id="heroThemeContainer">
        <div class="w hero-content" style="position: relative; z-index: 2;">
            <!-- Logo ubicado en la esquina izquierda -->
            <img src="LOGO.PNG" alt="Gracia Accesorios Logo" class="brand-logo-img">
            <div class="brand-text">
                <h1>Gracia Accesorios</h1>
                <p>Realza tu esencia con gracia✨</p>
                <p>Haz tu pedido a📲8952-2289</p>
            </div>
        </div>
        <!-- Banner visual idéntico a tus fotos de referencia -->
        <div id="tematicaBannerExtra" style="position: relative; z-index: 2;"></div>
    </header>
    <main class="w catalog-layout">
        <aside>
            <nav class="categories-container" id="categoryFilter">
                <button class="cat-btn active" data-category="todos">Ver Todo</button>
            </nav>
        </aside>
        <section class="product-grid" id="productGrid">
            <!-- Se carga dinámicamente desde Firebase -->
        </section>
    </main>
    <!-- Modal para ampliar imagen -->
    <div id="imageModal" class="modal">
        <span class="modal-close" id="modalClose">×</span>
        <img class="modal-content" id="imgModalExpanded">
    </div>
    <footer>
        <div class="w">
            <p>© 2026 Joyería Exclusiva. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            initializeFirestore,
            collection,
            onSnapshot,
            query,
            orderBy,
            doc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5BXWwtk7LsDCXmjYhz5LOIv5tz6U1N_A",
            authDomain: "gracia-accesorios.firebaseapp.com",
            projectId: "gracia-accesorios",
            storageBucket: "gracia-accesorios.firebasestorage.app",
            messagingSenderId: "843057510032",
            appId: "1:843057510032:web:148405f256ffd62b5a8a15"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        const grid = document.getElementById("productGrid");
        const categoryContainer = document.getElementById("categoryFilter");
        const cuerpoPagina = document.getElementById("cuerpoPagina");

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgModalExpanded");
        const modalClose = document.getElementById("modalClose");

        modalClose.addEventListener("click", () => { modal.style.display = "none"; });
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });

        const tematicaBannerExtra = document.getElementById("tematicaBannerExtra");

        // Lectura de la temática en tiempo real desde Firebase
        onSnapshot(doc(db, "configuracion", "tematica"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                aplicarDisenoExacto(data.tematica || "normal");
            } else {
                aplicarDisenoExacto("normal");
            }
        });

        function aplicarDisenoExacto(tipo) {
            cuerpoPagina.className = "";
            tematicaBannerExtra.innerHTML = "";

            if (tipo === "navidad") {
                cuerpoPagina.classList.add("theme-navidad");
                tematicaBannerExtra.innerHTML = `
                    <div class="banner-tematica-contenido">
                        <span class="sub-frase" style="color: #ffd700;">❄️ ¡Esta Navidad, regala elegancia! ❄️</span>
                        <h2 class="titulo-principal" style="color: #fca5a5;">Colección Navidad</h2>
                    </div>
                `;
            } else if (tipo === "independencia") {
                cuerpoPagina.classList.add("theme-independencia");
                tematicaBannerExtra.innerHTML = `
                    <div class="banner-tematica-contenido">
                        <span class="sub-frase" style="color: #93c5fd;">🇨🇷 ¡Viva Costa Rica! Pura Vida, Costa Rica! 🇨🇷</span>
                        <h2 class="titulo-principal" style="color: #ffffff;">Día de la Independencia</h2>
                    </div>
                `;
            } else if (tipo === "san-valentin") {
                cuerpoPagina.classList.add("theme-san-valentin");
                tematicaBannerExtra.innerHTML = `
                    <div class="banner-tematica-contenido">
                        <span class="sub-frase" style="color: #f4b6c2;">💕 Porque el amor también se lleva puesto 💕</span>
                        <h2 class="titulo-principal" style="color: #ffccd5;">Colección San Valentín</h2>
                    </div>
                `;
            } else {
                cuerpoPagina.classList.add("theme-normal");
            }
        }

        let productosCache = [];
        let categoriasCache = [];
        let categoriaActual = "todos";
        let limiteVisible = 24; 

        const qProducts = query(collection(db, "jewelry"), orderBy("creado", "desc"));
        onSnapshot(qProducts, (snapshot) => {
            productosCache = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.activo !== false) {
                    productosCache.push({ id: doc.id, ...data });
                }
            });
            renderizarProductos(categoriaActual);
        });

        onSnapshot(collection(db, "categories"), (snapshot) => {
            categoriasCache = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.nombre) {
                    categoriasCache.push(data.nombre.trim().toLowerCase());
                }
            });
            actualizarBotonesCategorias();
        });

        function actualizarBotonesCategorias() {
            if (!categoryContainer) return;
            let html = `<button class="cat-btn ${categoriaActual === 'todos' ? 'active' : ''}" data-category="todos">✨ Ver Todo</button>`;
            categoriasCache.forEach(cat => {
                const nombreVisual = cat.charAt(0).toUpperCase() + cat.slice(1);
                html += `<button class="cat-btn ${categoriaActual === cat ? 'active' : ''}" data-category="${cat}">${nombreVisual}</button>`;
            });
            categoryContainer.innerHTML = html;
            categoryContainer.querySelectorAll(".cat-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    categoryContainer.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    categoriaActual = btn.getAttribute("data-category");
                    limiteVisible = 24; 
                    renderizarProductos(categoriaActual);
                });
            });
        }

        function renderizarProductos(categoriaFiltro) {
            if (!grid) return;
            const filtrados = productosCache.filter(p => 
                categoriaFiltro === "todos" || (p.categoria && p.categoria.trim().toLowerCase() === categoriaFiltro)
            );
            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0;">No hay productos disponibles en esta categoría.</p>`;
                return;
            }
            const productosAMostrar = filtrados.slice(0, limiteVisible);
            let contenidoHtml = productosAMostrar.map(p => `
                <div class="product-card" data-category="${p.categoria}">
                    <div class="product-img-container">
                        <img src="${p.imagenUrl}" alt="${p.nombre}" class="zoomable-img" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-category-tag">${p.categoria}</div>
                            <h3 class="product-title">${p.nombre}</h3>
                        </div>
                        <div class="product-price-box">
                            ₡${(p.precio || 0).toLocaleString()}
                        </div>
                    </div>
                </div>
            `).join("");

            if (limiteVisible < filtrados.length) {
                contenidoHtml += `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 20px 0;">
                        <button id="btnCargarMas" style="background: var(--gold); color: #000; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem;">
                            Cargar más productos (${filtrados.length - limiteVisible} restantes)
                        </button>
                    </div>
                `;
            }
            grid.innerHTML = contenidoHtml;
            const btnMas = document.getElementById("btnCargarMas");
            if (btnMas) {
                btnMas.addEventListener("click", () => {
                    limiteVisible += 24; 
                    renderizarProductos(categoriaActual);
                });
            }
            grid.querySelectorAll(".zoomable-img").forEach(img => {
                img.addEventListener("click", () => {
                    modal.style.display = "flex";
                    modalImg.src = img.src;
                });
            });
        }
    </script>
</body>
</html>
