<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracia Accesorios | Catálogo Exclusivo</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="LOGO.PNG" id="faviconLogo">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* --- ESTILOS BASE Y DECORACIONES FLOTANTES --- */
        body {
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .decoracion-lateral {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
            transition: all 0.4s ease;
            mix-blend-mode: multiply;
        }

        .hero {
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
        }

        .catalog-layout, footer {
            position: relative;
            z-index: 2;
        }

        /* =========================================================
           1. TEMA NAVIDAD (Rosado y Blanco - SIN NEGRO)
           ========================================================= */
        body.theme-navidad {
            background-color: #fff0f3 !important;
            color: #500b1d !important;
        }
        body.theme-navidad .hero {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%) !important;
            border-bottom: 4px solid #e11d48 !important;
            color: #ffffff !important;
        }
        body.theme-navidad .brand-text h1,
        body.theme-navidad .brand-text p {
            color: #ffffff !important;
        }
        body.theme-navidad .banner-largo-navidad {
            width: 100%;
            max-height: 230px;
            object-fit: cover;
            display: block;
            border-top: 3px solid #ffffff;
        }
        body.theme-navidad .cat-btn {
            background: #ffffff !important;
            color: #e11d48 !important;
            border: 1px solid #fecdd3 !important;
        }
        body.theme-navidad .cat-btn.active,
        body.theme-navidad .cat-btn:hover {
            background: #e11d48 !important;
            color: #ffffff !important;
            border-color: #e11d48 !important;
        }
        body.theme-navidad .product-card {
            background: #ffffff !important;
            border: 2px solid #ffe4e6 !important;
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.08) !important;
        }
        body.theme-navidad .product-category-tag {
            color: #e11d48 !important;
            font-weight: 700 !important;
        }
        body.theme-navidad .product-title {
            color: #881337 !important;
        }
        body.theme-navidad .product-price-box {
            background: #e11d48 !important;
            color: #ffffff !important;
            border: 1px solid #be123c !important;
        }
        body.theme-navidad footer {
            background: #e11d48 !important;
            color: #ffffff !important;
            border-top: 3px solid #ffffff !important;
        }

        /* =========================================================
           2. TEMA INDEPENDENCIA (Azul, Blanco y Rojo - SIN NEGRO)
           ========================================================= */
        body.theme-independencia {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        body.theme-independencia .hero {
            background: linear-gradient(90deg, #1e3a8a 0%, #ffffff 50%, #dc2626 100%) !important;
            border-bottom: 4px solid #1e3a8a !important;
        }
        body.theme-independencia .hero-content {
            background: rgba(30, 58, 138, 0.92);
            border-radius: 16px;
            padding: 15px 25px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        body.theme-independencia .brand-text h1,
        body.theme-independencia .brand-text p {
            color: #ffffff !important;
        }
        body.theme-independencia .cat-btn {
            background: #eff6ff !important;
            color: #1e3a8a !important;
            border: 1px solid #bfdbfe !important;
        }
        body.theme-independencia .cat-btn.active,
        body.theme-independencia .cat-btn:hover {
            background: #1d4ed8 !important;
            color: #ffffff !important;
            border-color: #1d4ed8 !important;
        }
        body.theme-independencia .product-card {
            background: #ffffff !important;
            border: 2px solid #dbeafe !important;
            box-shadow: 0 6px 18px rgba(29, 78, 216, 0.08) !important;
        }
        body.theme-independencia .product-category-tag {
            color: #dc2626 !important;
            font-weight: 700 !important;
        }
        body.theme-independencia .product-title {
            color: #1e3a8a !important;
        }
        body.theme-independencia .product-price-box {
            background: #1d4ed8 !important;
            color: #ffffff !important;
            border: 1px solid #1e40af !important;
        }
        body.theme-independencia footer {
            background: #1e3a8a !important;
            color: #ffffff !important;
            border-top: 3px solid #dc2626 !important;
        }

        /* =========================================================
           3. TEMA SAN VALENTÍN (Rosado y Blanco - SIN NEGRO)
           ========================================================= */
        body.theme-san-valentin {
            background-color: #fff5f7 !important;
            color: #4c0519 !important;
        }
        body.theme-san-valentin .hero {
            background: linear-gradient(135deg, #be123c 0%, #fb7185 100%) !important;
            border-bottom: 4px solid #e11d48 !important;
        }
        body.theme-san-valentin .brand-text h1,
        body.theme-san-valentin .brand-text p {
            color: #ffffff !important;
        }
        body.theme-san-valentin .cat-btn {
            background: #ffffff !important;
            color: #be123c !important;
            border: 1px solid #fecdd3 !important;
        }
        body.theme-san-valentin .cat-btn.active,
        body.theme-san-valentin .cat-btn:hover {
            background: #e11d48 !important;
            color: #ffffff !important;
            border-color: #e11d48 !important;
        }
        body.theme-san-valentin .product-card {
            background: #ffffff !important;
            border: 2px solid #ffe4e6 !important;
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.08) !important;
        }
        body.theme-san-valentin .product-category-tag {
            color: #e11d48 !important;
            font-weight: 700 !important;
        }
        body.theme-san-valentin .product-title {
            color: #881337 !important;
        }
        body.theme-san-valentin .product-price-box {
            background: #e11d48 !important;
            color: #ffffff !important;
            border: 1px solid #be123c !important;
        }
        body.theme-san-valentin footer {
            background: #be123c !important;
            color: #ffffff !important;
            border-top: 3px solid #ffffff !important;
        }

        @media (max-width: 768px) {
            .decoracion-lateral {
                width: 60px !important;
                opacity: 0.5;
            }
        }
    </style>
</head>
<body id="cuerpoPagina">

    <div id="decoracionesDistribuidas"></div>

    <header class="hero" id="heroThemeContainer">
        <div class="w hero-content">
            <!-- Logo dinámico según la temática -->
            <img src="LOGO.PNG" alt="Gracia Accesorios Logo" class="brand-logo-img" id="brandLogoImg">
            <div class="brand-text">
                <h1>Gracia Accesorios</h1>
                <p>Realza tu esencia con gracia✨</p>
                <p>Haz tu pedido a📲8952-2289</p>
            </div>
        </div>
        <div id="tematicaBannerExtra"></div>
    </header>

    <main class="w catalog-layout">
        <aside>
            <nav class="categories-container" id="categoryFilter">
                <button class="cat-btn active" data-category="todos">Ver Todo</button>
            </nav>
        </aside>
        <section class="product-grid" id="productGrid">
            <!-- Se carga dinámicamente desde Firebase -->
        </section>
    </main>

    <!-- Modal para ampliar imagen -->
    <div id="imageModal" class="modal">
        <span class="modal-close" id="modalClose">×</span>
        <img class="modal-content" id="imgModalExpanded">
    </div>

    <footer>
        <div class="w">
            <p>© 2026 Joyería Exclusiva. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            initializeFirestore,
            collection,
            onSnapshot,
            query,
            orderBy,
            doc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5BXWwtk7LsDCXmjYhz5LOIv5tz6U1N_A",
            authDomain: "gracia-accesorios.firebaseapp.com",
            projectId: "gracia-accesorios",
            storageBucket: "gracia-accesorios.firebasestorage.app",
            messagingSenderId: "843057510032",
            appId: "1:843057510032:web:148405f256ffd62b5a8a15"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        const grid = document.getElementById("productGrid");
        const categoryContainer = document.getElementById("categoryFilter");
        const cuerpoPagina = document.getElementById("cuerpoPagina");
        const tematicaBannerExtra = document.getElementById("tematicaBannerExtra");
        const decoracionesDistribuidas = document.getElementById("decoracionesDistribuidas");
        const brandLogoImg = document.getElementById("brandLogoImg");
        const faviconLogo = document.getElementById("faviconLogo");

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgModalExpanded");
        const modalClose = document.getElementById("modalClose");

        modalClose.addEventListener("click", () => { modal.style.display = "none"; });
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });

        onSnapshot(doc(db, "configuracion", "tematica"), (docSnap) => {
            if (docSnap.exists()) {
                aplicarTematica(docSnap.data().tematica || "normal");
            } else {
                aplicarTematica("normal");
            }
        });

        function aplicarTematica(tipo) {
            cuerpoPagina.className = "";
            tematicaBannerExtra.innerHTML = "";
            decoracionesDistribuidas.innerHTML = "";

            if (tipo === "navidad") {
                cuerpoPagina.classList.add("theme-navidad");
                brandLogoImg.src = "rosado.jpg"; // Logo rosado para Navidad
                faviconLogo.href = "rosado.jpg";

                // Banner largo original de Navidad
                tematicaBannerExtra.innerHTML = `
                    <img src="banner-navidad.png" alt="Colección Navidad" class="banner-largo-navidad">
                `;

                // Nuevas imágenes de Navidad distribuidas (Árbol, Esfera y Caja de regalo)
                decoracionesDistribuidas.innerHTML = `
                    <img src="IMG_7075.JPG.jpeg" class="decoracion-lateral" style="bottom: 20px; left: 15px; width: 110px;" title="Árbol de Navidad">
                    <img src="IMG_7072.JPG.jpg" class="decoracion-lateral" style="top: 320px; right: 15px; width: 90px;" title="Esfera Navideña">
                    <img src="IMG_7070.JPG.jpeg" class="decoracion-lateral" style="top: 320px; left: 15px; width: 105px;" title="Regalo Navideño">
                    <img src="IMG_7072.JPG.jpg" class="decoracion-lateral" style="bottom: 120px; right: 20px; width: 85px;">
                `;

            } else if (tipo === "independencia") {
                cuerpoPagina.classList.add("theme-independencia");
                brandLogoImg.src = "logo-azul.jpg"; // Logo azul para Independencia
                faviconLogo.href = "logo-azul.jpg";

                // Encabezado patrio con la nueva bandera alargada (banderita.jpg)
                tematicaBannerExtra.innerHTML = `
                    <div style="background: #ffffff; text-align: center; padding: 10px; border-top: 3px solid #1e3a8a;">
                        <img src="banderita.jpg" alt="Bandera Costa Rica" style="max-height: 140px; width: auto; max-width: 100%; border-radius: 8px;">
                    </div>
                `;

                // Bandera y niña típica distribuidas a los costados
                decoracionesDistribuidas.innerHTML = `
                    <img src="baila.jpg" class="decoracion-lateral" style="bottom: 20px; left: 15px; width: 100px;">
                    <img src="banderita.jpg" class="decoracion-lateral" style="top: 340px; right: 15px; width: 110px;">
                    <img src="baila.jpg" class="decoracion-lateral" style="top: 340px; left: 15px; width: 95px;">
                `;

            } else if (tipo === "san-valentin") {
                cuerpoPagina.classList.add("theme-san-valentin");
                brandLogoImg.src = "rosado.jpg"; // Logo rosado para San Valentín
                faviconLogo.href = "rosado.jpg";

                tematicaBannerExtra.innerHTML = `
                    <div style="background: #ffffff; text-align: center; padding: 10px; border-top: 3px solid #e11d48;">
                        <img src="valen.jpg" alt="Colección San Valentín" style="max-height: 210px; width: auto; max-width: 100%; border-radius: 12px;">
                    </div>
                `;

                decoracionesDistribuidas.innerHTML = `
                    <img src="corazon.jpg" class="decoracion-lateral" style="top: 320px; left: 15px; width: 90px; transform: rotate(-12deg);">
                    <img src="cora.jpg" class="decoracion-lateral" style="top: 330px; right: 15px; width: 105px;">
                    <img src="cora.jpg" class="decoracion-lateral" style="bottom: 30px; left: 20px; width: 100px;">
                    <img src="corazon.jpg" class="decoracion-lateral" style="bottom: 110px; right: 20px; width: 85px; transform: rotate(15deg);">
                `;
            } else {
                // Tema normal original por defecto (Negro y Dorado con LOGO.PNG)
                brandLogoImg.src = "LOGO.PNG";
                faviconLogo.href = "LOGO.PNG";
            }
        }

        let productosCache = [];
        let categoriasCache = [];
        let categoriaActual = "todos";
        let limiteVisible = 24; 

        const qProducts = query(collection(db, "jewelry"), orderBy("creado", "desc"));
        onSnapshot(qProducts, (snapshot) => {
            productosCache = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.activo !== false) {
                    productosCache.push({ id: doc.id, ...data });
                }
            });
            renderizarProductos(categoriaActual);
        });

        onSnapshot(collection(db, "categories"), (snapshot) => {
            categoriasCache = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.nombre) {
                    categoriasCache.push(data.nombre.trim().toLowerCase());
                }
            });
            actualizarBotonesCategorias();
        });

        function actualizarBotonesCategorias() {
            if (!categoryContainer) return;
            let html = `<button class="cat-btn ${categoriaActual === 'todos' ? 'active' : ''}" data-category="todos">✨ Ver Todo</button>`;
            categoriasCache.forEach(cat => {
                const nombreVisual = cat.charAt(0).toUpperCase() + cat.slice(1);
                html += `<button class="cat-btn ${categoriaActual === cat ? 'active' : ''}" data-category="${cat}">${nombreVisual}</button>`;
            });
            categoryContainer.innerHTML = html;
            categoryContainer.querySelectorAll(".cat-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    categoryContainer.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    categoriaActual = btn.getAttribute("data-category");
                    limiteVisible = 24; 
                    renderizarProductos(categoriaActual);
                });
            });
        }

        function renderizarProductos(categoriaFiltro) {
            if (!grid) return;
            const filtrados = productosCache.filter(p => 
                categoriaFiltro === "todos" || (p.categoria && p.categoria.trim().toLowerCase() === categoriaFiltro)
            );
            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 0;">No hay productos disponibles en esta categoría.</p>`;
                return;
            }
            const productosAMostrar = filtrados.slice(0, limiteVisible);
            let contenidoHtml = productosAMostrar.map(p => `
                <div class="product-card" data-category="${p.categoria}">
                    <div class="product-img-container">
                        <img src="${p.imagenUrl}" alt="${p.nombre}" class="zoomable-img" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-category-tag">${p.categoria}</div>
                            <h3 class="product-title">${p.nombre}</h3>
                        </div>
                        <div class="product-price-box">
                            ₡${(p.precio || 0).toLocaleString()}
                        </div>
                    </div>
                </div>
            `).join("");

            if (limiteVisible < filtrados.length) {
                contenidoHtml += `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 20px 0;">
                        <button id="btnCargarMas" style="background: var(--gold); color: #000; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem;">
                            Cargar más productos (${filtrados.length - limiteVisible} restantes)
                        </button>
                    </div>
                `;
            }
            grid.innerHTML = contenidoHtml;
            const btnMas = document.getElementById("btnCargarMas");
            if (btnMas) {
                btnMas.addEventListener("click", () => {
                    limiteVisible += 24; 
                    renderizarProductos(categoriaActual);
                });
            }
            grid.querySelectorAll(".zoomable-img").forEach(img => {
                img.addEventListener("click", () => {
                    modal.style.display = "flex";
                    modalImg.src = img.src;
                });
            });
        }
    </script>
</body>
</html>
